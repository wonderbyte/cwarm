[project]
name = "cwarm"
version = "1.0.0"
description = "Stagger-warm coding-agent accounts (Claude Code, Codex, ...) so their usage windows open early and reset at different times."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cwarm = "cwarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cwarm"]
