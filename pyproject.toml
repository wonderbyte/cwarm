[project]
name = "cwarm"
version = "0.2.1"
description = "Warm your Claude Code 5-hour usage window on a schedule so the dead time lands off-hours — and stagger several accounts if you rotate them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "tzdata; platform_system == 'Windows'",  # zoneinfo has no system tz db on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "commitizen>=3", "ruff>=0.6"]

[project.scripts]
cwarm = "cwarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cwarm"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
version_files = ["cwarm/__init__.py:__version__"]
update_changelog_on_bump = true
major_version_zero = true
annotated_tag = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "C901"]
extend-select = ["I"]
isort.combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
